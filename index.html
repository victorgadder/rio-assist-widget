<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rio Insight Widget</title>
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        background: #f5f7fa;
        color: #1f2f36;
      }

      .page {
        padding: 24px;
        max-width: 720px;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <p>Abra o botão flutuante no canto inferior direito para testar.</p>
    </div>

    <rio-assist-widget
      data-title="Rio Insight"
      data-button-label="Rio Insight"
      data-placeholder="Pergunte alguma coisa"
      data-suggestions="Resumo da Frota|Frota Disponível|Chamados Abertos|Parados + Causas|Aguardando Peças|Principais Gargalos|Tempo por Concessionária|Tempo de Ciclo|Preventiva x Corretiva"
      data-accent-color="#c02267"
    ></rio-assist-widget>

    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="/src/playground.ts"></script>
    <script>
      // Posiciona o botao flutuante proximo ao topo da viewport calculando bottom a partir da altura disponivel.
      (function () {
        const widget = document.querySelector('rio-assist-widget');
        if (!widget) return;

        const TOP_MARGIN = 96; // distancia desejada a partir do topo em px
        const BUTTON_HEIGHT = 64;
        const MIN_BOTTOM = 12;

        const updateFloatingOffset = () => {
          const viewport = window.innerHeight || document.documentElement.clientHeight || 0;
          const bottom = Math.max(MIN_BOTTOM, viewport - TOP_MARGIN - BUTTON_HEIGHT);
          widget.setAttribute('data-floating-offset', String(bottom));
        };

        updateFloatingOffset();
        window.addEventListener('resize', updateFloatingOffset);
      })();
    </script>
  </body>
</html>
