<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rio Insight Widget</title>
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        background: #f5f7fa;
        color: #1f2f36;
      }

      .page {
        padding: 24px;
        max-width: 720px;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <p>Abra o botão flutuante no canto inferior direito para testar.</p>
    </div>

    <rio-assist-widget
      data-title="Rio Insight"
      data-button-label="Rio Insight"
      data-placeholder="Pergunte alguma coisa"
      data-suggestions="Veículos com problemas|Valor das peças|Planos de manutenção"
      data-accent-color="#c02267"
    ></rio-assist-widget>

    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="/src/playground.ts"></script>
  </body>
</html>
